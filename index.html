<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flashcard Chinese</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Segoe UI, sans-serif;
}
.app{
    width:420px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    color:white;
}
.progress-container{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin-bottom:20px;
    overflow:hidden;
}
.progress-bar{
    height:100%;
    width:0%;
    background:#00f5d4;
    transition:0.3s;
}
.card{
    height:220px;
    background:white;
    color:#333;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    margin-bottom:20px;
    position:relative;
}
.speaker{
    position:absolute;
    bottom:15px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.info{
    text-align:center;
    min-height:70px;
    font-size:18px;
    margin-bottom:15px;
}
.controls{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}
button{
    border:none;
    border-radius:50px;
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}
.nav{ background:white; color:#333; }
.main{ width:100%; background:#00f5d4; font-weight:bold; }
</style>
</head>

<body>
<div class="app">

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="card">
<div id="hanziBox">开始</div>
<div class="speaker" onclick="speakWord()">🔊</div>
</div>

<div class="info" id="infoBox">
Nhấn "Hiện đáp án"
</div>

<div class="controls">
<button class="nav" onclick="prevWord()">⬅</button>
<button class="nav" onclick="nextWord()">➡</button>
</div>

<button class="main" onclick="showAnswer()">Hiện đáp án</button>

</div>

<script>

let vocabulary=[
{hanzi:"堵车",pinyin:"dǔchē",meaning:"tắc đường, kẹt xe"},
{hanzi:"厉害",pinyin:"lìhai",meaning:"giỏi, lợi hại"},
{hanzi:"迟到",pinyin:"chídào",meaning:"đến muộn"},
{hanzi:"快要",pinyin:"kuàiyào",meaning:"sắp"},
{hanzi:"开始",pinyin:"kāishǐ",meaning:"bắt đầu"},
{hanzi:"队",pinyin:"duì",meaning:"đội"},
{hanzi:"会",pinyin:"huì",meaning:"sẽ"},
{hanzi:"赢",pinyin:"yíng",meaning:"thắng"},
{hanzi:"输",pinyin:"shū",meaning:"thua"},
{hanzi:"进步",pinyin:"jìnbù",meaning:"tiến bộ"},
{hanzi:"猜",pinyin:"cāi",meaning:"đoán"},
{hanzi:"比",pinyin:"bǐ",meaning:"so sánh, tỷ số"},
{hanzi:"才",pinyin:"cái",meaning:"mới"},
{hanzi:"干",pinyin:"gàn",meaning:"làm"},
{hanzi:"这么",pinyin:"zhème",meaning:"như vậy"},
{hanzi:"那么",pinyin:"nàme",meaning:"như thế"},
{hanzi:"小说",pinyin:"xiǎoshuō",meaning:"tiểu thuyết"},

{hanzi:"完",pinyin:"wán",meaning:"xong"},
{hanzi:"言情",pinyin:"yánqíng",meaning:"ngôn tình"},
{hanzi:"感兴趣",pinyin:"gǎn xìngqù",meaning:"cảm thấy hứng thú"},
{hanzi:"爱好",pinyin:"àihào",meaning:"sở thích"},
{hanzi:"游戏",pinyin:"yóuxì",meaning:"trò chơi"},
{hanzi:"爱",pinyin:"ài",meaning:"yêu"},
{hanzi:"经常",pinyin:"jīngcháng",meaning:"thường xuyên"},
{hanzi:"熬夜",pinyin:"áoyè",meaning:"thức đêm"},
{hanzi:"花",pinyin:"huā",meaning:"tiêu, hao"}
];
let shuffled=[...vocabulary].sort(()=>Math.random()-0.5);
let index=0;
let answerShown=false;

function showWord(){
let w=shuffled[index];
document.getElementById("hanziBox").innerText=w.hanzi;
document.getElementById("infoBox").innerText="Nhấn \"Hiện đáp án\"";
answerShown=false;

let percent=Math.round(((index+1)/shuffled.length)*100);
document.getElementById("progressBar").style.width=percent+"%";
}

function showAnswer(){
if(answerShown) return;
let w=shuffled[index];
document.getElementById("infoBox").innerHTML="<b>"+w.pinyin+"</b><br>"+w.meaning;
answerShown=true;
speakWord();
}

function nextWord(){ if(index<shuffled.length-1){ index++; showWord(); } }
function prevWord(){ if(index>0){ index--; showWord(); } }

function speakWord(){
speechSynthesis.cancel();
let w=shuffled[index];
let u=new SpeechSynthesisUtterance(w.hanzi);
u.lang="zh-CN";
speechSynthesis.speak(u);
}

showWord();

</script>
</body>
</html>
