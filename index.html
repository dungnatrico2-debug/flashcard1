<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flashcard Chinese</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Segoe UI, sans-serif;
}
.app{
    width:420px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    color:white;
}
.progress-container{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin-bottom:20px;
    overflow:hidden;
}
.progress-bar{
    height:100%;
    width:0%;
    background:#00f5d4;
    transition:0.3s;
}
.card{
    height:220px;
    background:white;
    color:#333;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    margin-bottom:20px;
    position:relative;
}
.speaker{
    position:absolute;
    bottom:15px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.info{
    text-align:center;
    min-height:70px;
    font-size:18px;
    margin-bottom:15px;
}
.controls{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}
button{
    border:none;
    border-radius:50px;
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}
.nav{ background:white; color:#333; }
.main{ width:100%; background:#00f5d4; font-weight:bold; }
</style>
</head>

<body>
<div class="app">

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="card">
<div id="hanziBox">开始</div>
<div class="speaker" onclick="speakWord()">🔊</div>
</div>

<div class="info" id="infoBox">
Nhấn "Hiện đáp án"
</div>

<div class="controls">
<button class="nav" onclick="prevWord()">⬅</button>
<button class="nav" onclick="nextWord()">➡</button>
</div>

<button class="main" onclick="showAnswer()">Hiện đáp án</button>

</div>

<script>

let vocabulary=[
{hanzi:"邮局",pinyin:"yóujú",meaning:"bưu điện"},
{hanzi:"走",pinyin:"zǒu",meaning:"đi"},
{hanzi:"从",pinyin:"cóng",meaning:"từ"},
{hanzi:"一直",pinyin:"yìzhí",meaning:"thẳng"},
{hanzi:"离",pinyin:"lí",meaning:"cách"},
{hanzi:"远",pinyin:"yuǎn",meaning:"xa"},
{hanzi:"近",pinyin:"jìn",meaning:"gần"},
{hanzi:"大概",pinyin:"dàgài",meaning:"khoảng"},
{hanzi:"公里",pinyin:"gōnglǐ",meaning:"kilomet"},
{hanzi:"不好意思",pinyin:"bù hǎo yìsi",meaning:"xin lỗi"},
{hanzi:"再",pinyin:"zài",meaning:"lại"},
{hanzi:"附近",pinyin:"fùjìn",meaning:"lân cận"},
{hanzi:"购物",pinyin:"gòuwù",meaning:"mua sắm"},
{hanzi:"中心",pinyin:"zhōngxīn",meaning:"trung tâm"},
{hanzi:"前边",pinyin:"qiánbian",meaning:"phía trước"},
{hanzi:"后边",pinyin:"hòubian",meaning:"phía sau"},

{hanzi:"座",pinyin:"zuò",meaning:"tòa"},
{hanzi:"高楼",pinyin:"gāolóu",meaning:"tòa nhà cao tầng"},
{hanzi:"十字路口",pinyin:"shízì lùkǒu",meaning:"ngã tư"},
{hanzi:"往",pinyin:"wǎng",meaning:"hướng về"},
{hanzi:"左边",pinyin:"zuǒbiān",meaning:"bên trái"},
{hanzi:"右边",pinyin:"yòubiān",meaning:"bên phải"},
{hanzi:"拐",pinyin:"guǎi",meaning:"rẽ"},
{hanzi:"停",pinyin:"tíng",meaning:"dừng"},
{hanzi:"广场",pinyin:"guǎngchǎng",meaning:"quảng trường"},
{hanzi:"中间",pinyin:"zhōngjiān",meaning:"ở giữa"},
{hanzi:"东边",pinyin:"dōngbiān",meaning:"phía đông"},
{hanzi:"西边",pinyin:"xībiān",meaning:"phía tây"},
{hanzi:"北边",pinyin:"běibiān",meaning:"phía bắc"},
{hanzi:"南边",pinyin:"nánbiān",meaning:"phía nam"},
{hanzi:"体育馆",pinyin:"tǐyùguǎn",meaning:"cung thể thao"},
{hanzi:"里边",pinyin:"lǐbian",meaning:"bên trong"},
{hanzi:"外边",pinyin:"wàibian",meaning:"bên ngoài"},
{hanzi:"上边",pinyin:"shàngbian",meaning:"bên trên"},
{hanzi:"下边",pinyin:"xiàbian",meaning:"bên dưới"},

{hanzi:"扬州中心",pinyin:"Yángzhōu zhōngxīn",meaning:"trung tâm Dương Châu"},
{hanzi:"巴亭广场",pinyin:"Bātíng guǎngchǎng",meaning:"quảng trường Ba Đình"},
{hanzi:"西湖",pinyin:"Xīhú",meaning:"Hồ Tây"},
];

let shuffled=[...vocabulary].sort(()=>Math.random()-0.5);
let index=0;
let answerShown=false;

function showWord(){
let w=shuffled[index];
document.getElementById("hanziBox").innerText=w.hanzi;
document.getElementById("infoBox").innerText="Nhấn \"Hiện đáp án\"";
answerShown=false;

let percent=Math.round(((index+1)/shuffled.length)*100);
document.getElementById("progressBar").style.width=percent+"%";
}

function showAnswer(){
if(answerShown) return;
let w=shuffled[index];
document.getElementById("infoBox").innerHTML="<b>"+w.pinyin+"</b><br>"+w.meaning;
answerShown=true;
speakWord();
}

function nextWord(){ if(index<shuffled.length-1){ index++; showWord(); } }
function prevWord(){ if(index>0){ index--; showWord(); } }

function speakWord(){
speechSynthesis.cancel();
let w=shuffled[index];
let u=new SpeechSynthesisUtterance(w.hanzi);
u.lang="zh-CN";
speechSynthesis.speak(u);
}

showWord();

</script>
</body>
</html>
