<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flashcard Chinese</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Segoe UI, sans-serif;
}
.app{
    width:420px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    color:white;
}
.progress-container{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin-bottom:20px;
    overflow:hidden;
}
.progress-bar{
    height:100%;
    width:0%;
    background:#00f5d4;
    transition:0.3s;
}
.card{
    height:220px;
    background:white;
    color:#333;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    margin-bottom:20px;
    position:relative;
}
.speaker{
    position:absolute;
    bottom:15px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.info{
    text-align:center;
    min-height:70px;
    font-size:18px;
    margin-bottom:15px;
}
.controls{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}
button{
    border:none;
    border-radius:50px;
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}
.nav{ background:white; color:#333; }
.main{ width:100%; background:#00f5d4; font-weight:bold; }
</style>
</head>

<body>
<div class="app">

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="card">
<div id="hanziBox">开始</div>
<div class="speaker" onclick="speakWord()">🔊</div>
</div>

<div class="info" id="infoBox">
Nhấn "Hiện đáp án"
</div>

<div class="controls">
<button class="nav" onclick="prevWord()">⬅</button>
<button class="nav" onclick="nextWord()">➡</button>
</div>

<button class="main" onclick="showAnswer()">Hiện đáp án</button>

</div>

<script>

let vocabulary=[
{hanzi:"茶馆",pinyin:"cháguǎn",meaning:"quán trà"},
{hanzi:"美术馆",pinyin:"měishùguǎn",meaning:"viện bảo tàng mỹ thuật"},
{hanzi:"原来",pinyin:"yuánlái",meaning:"vốn dĩ, ban đầu"},
{hanzi:"陪",pinyin:"péi",meaning:"đi cùng, theo"},
{hanzi:"京剧",pinyin:"jīngjù",meaning:"kinh kịch"},
{hanzi:"动物园",pinyin:"dòngwùyuán",meaning:"sở thú"},
{hanzi:"熊猫",pinyin:"xióngmāo",meaning:"gấu trúc"},
{hanzi:"机场",pinyin:"jīchǎng",meaning:"sân bay"},
{hanzi:"咱们",pinyin:"zánmen",meaning:"chúng ta"},
{hanzi:"约",pinyin:"yuē",meaning:"hẹn"},
{hanzi:"怎么",pinyin:"zěnme",meaning:"sao, thế nào"},
{hanzi:"迷路",pinyin:"mílù",meaning:"lạc đường"},
{hanzi:"路人",pinyin:"lùrén",meaning:"người đi đường"},
{hanzi:"公交车",pinyin:"gōngjiāochē",meaning:"xe buýt"},
{hanzi:"发",pinyin:"fā",meaning:"phát, gửi"},
{hanzi:"定位",pinyin:"dìngwèi",meaning:"định vị"},

{hanzi:"厨房",pinyin:"chúfáng",meaning:"phòng bếp"},
{hanzi:"客厅",pinyin:"kètīng",meaning:"phòng khách"},
{hanzi:"卧室",pinyin:"wòshì",meaning:"phòng ngủ"},
{hanzi:"卫生间",pinyin:"wèishēngjiān",meaning:"nhà vệ sinh"},
{hanzi:"总",pinyin:"zǒng",meaning:"tổng, luôn luôn"},
{hanzi:"面积",pinyin:"miànjī",meaning:"diện tích"},
{hanzi:"平方米",pinyin:"píngfāngmǐ",meaning:"mét vuông"},
{hanzi:"沙发",pinyin:"shāfā",meaning:"ghế sofa"},
{hanzi:"站",pinyin:"zhàn",meaning:"bến, trạm"},
{hanzi:"班",pinyin:"bān",meaning:"chuyến"},
{hanzi:"对",pinyin:"duì",meaning:"đối với"},
{hanzi:"满意",pinyin:"mǎnyì",meaning:"hài lòng"},

{hanzi:"请假",pinyin:"qǐng jià",meaning:"xin nghỉ"},
{hanzi:"医院",pinyin:"yīyuàn",meaning:"bệnh viện"},
{hanzi:"得",pinyin:"dé",meaning:"phải, nên"},
{hanzi:"该",pinyin:"gāi",meaning:"nên"},
{hanzi:"妻子",pinyin:"qīzi",meaning:"vợ"},
{hanzi:"丈夫",pinyin:"zhàngfu",meaning:"chồng"},
{hanzi:"套",pinyin:"tào",meaning:"căn (lượng từ)"},
{hanzi:"房子",pinyin:"fángzi",meaning:"nhà"},
{hanzi:"以前",pinyin:"yǐqián",meaning:"trước đây"},
{hanzi:"已经",pinyin:"yǐjīng",meaning:"đã"},
{hanzi:"够",pinyin:"gòu",meaning:"đủ"},
{hanzi:"生活",pinyin:"shēnghuó",meaning:"cuộc sống"},
{hanzi:"决定",pinyin:"juédìng",meaning:"quyết định"},
{hanzi:"搬",pinyin:"bān",meaning:"chuyển, dời"},
{hanzi:"周围",pinyin:"zhōuwéi",meaning:"xung quanh"},
{hanzi:"环境",pinyin:"huánjìng",meaning:"môi trường"},
{hanzi:"安静",pinyin:"ānjìng",meaning:"yên tĩnh"},
{hanzi:"电梯",pinyin:"diàntī",meaning:"thang máy"},

{hanzi:"堵车",pinyin:"dǔchē",meaning:"tắc đường, kẹt xe"},
{hanzi:"厉害",pinyin:"lìhai",meaning:"giỏi, lợi hại"},
{hanzi:"迟到",pinyin:"chídào",meaning:"đến muộn"},
{hanzi:"快要",pinyin:"kuàiyào",meaning:"sắp"},
{hanzi:"开始",pinyin:"kāishǐ",meaning:"bắt đầu"},
{hanzi:"队",pinyin:"duì",meaning:"đội"},

{hanzi:"赢",pinyin:"yíng",meaning:"thắng"},
{hanzi:"输",pinyin:"shū",meaning:"thua"},
{hanzi:"进步",pinyin:"jìnbù",meaning:"tiến bộ"},
{hanzi:"猜",pinyin:"cāi",meaning:"đoán"},

{hanzi:"才",pinyin:"cái",meaning:"mới"},
{hanzi:"干",pinyin:"gàn",meaning:"làm"},
{hanzi:"这么",pinyin:"zhème",meaning:"như vậy"},
{hanzi:"那么",pinyin:"nàme",meaning:"như thế"},
{hanzi:"小说",pinyin:"xiǎoshuō",meaning:"tiểu thuyết"},
{hanzi:"完",pinyin:"wán",meaning:"xong"},
{hanzi:"言情",pinyin:"yánqíng",meaning:"ngôn tình"},
{hanzi:"感兴趣",pinyin:"gǎn xìngqù",meaning:"cảm thấy hứng thú"},
{hanzi:"爱好",pinyin:"àihào",meaning:"sở thích"},
{hanzi:"游戏",pinyin:"yóuxì",meaning:"trò chơi"},
{hanzi:"爱",pinyin:"ài",meaning:"yêu"},
{hanzi:"经常",pinyin:"jīngcháng",meaning:"thường xuyên"},
{hanzi:"熬夜",pinyin:"áoyè",meaning:"thức đêm"},
{hanzi:"花",pinyin:"huā",meaning:"tiêu, hao"},
];
let shuffled=[...vocabulary].sort(()=>Math.random()-0.5);
let index=0;
let answerShown=false;

function showWord(){
let w=shuffled[index];
document.getElementById("hanziBox").innerText=w.hanzi;
document.getElementById("infoBox").innerText="Nhấn \"Hiện đáp án\"";
answerShown=false;

let percent=Math.round(((index+1)/shuffled.length)*100);
document.getElementById("progressBar").style.width=percent+"%";
}

function showAnswer(){
if(answerShown) return;
let w=shuffled[index];
document.getElementById("infoBox").innerHTML="<b>"+w.pinyin+"</b><br>"+w.meaning;
answerShown=true;
speakWord();
}

function nextWord(){ if(index<shuffled.length-1){ index++; showWord(); } }
function prevWord(){ if(index>0){ index--; showWord(); } }

function speakWord(){
speechSynthesis.cancel();
let w=shuffled[index];
let u=new SpeechSynthesisUtterance(w.hanzi);
u.lang="zh-CN";
speechSynthesis.speak(u);
}

showWord();

</script>
</body>
</html>
