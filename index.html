<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flashcard Chinese</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Segoe UI, sans-serif;
}
.app{
    width:420px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    color:white;
}
.progress-container{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin-bottom:20px;
    overflow:hidden;
}
.progress-bar{
    height:100%;
    width:0%;
    background:#00f5d4;
    transition:0.3s;
}
.card{
    height:220px;
    background:white;
    color:#333;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    margin-bottom:20px;
    position:relative;
}
.speaker{
    position:absolute;
    bottom:15px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.info{
    text-align:center;
    min-height:70px;
    font-size:18px;
    margin-bottom:15px;
}
.controls{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}
button{
    border:none;
    border-radius:50px;
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}
.nav{ background:white; color:#333; }
.main{ width:100%; background:#00f5d4; font-weight:bold; }
</style>
</head>

<body>
<div class="app">

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="card">
<div id="hanziBox">开始</div>
<div class="speaker" onclick="speakWord()">🔊</div>
</div>

<div class="info" id="infoBox">
Nhấn "Hiện đáp án"
</div>

<div class="controls">
<button class="nav" onclick="prevWord()">⬅</button>
<button class="nav" onclick="nextWord()">➡</button>
</div>

<button class="main" onclick="showAnswer()">Hiện đáp án</button>

</div>

<script>

let vocabulary=[
{hanzi:"厨房",pinyin:"chúfáng",meaning:"phòng bếp"},
{hanzi:"客厅",pinyin:"kètīng",meaning:"phòng khách"},
{hanzi:"卧室",pinyin:"wòshì",meaning:"phòng ngủ"},
{hanzi:"卫生间",pinyin:"wèishēngjiān",meaning:"nhà vệ sinh"},
{hanzi:"总",pinyin:"zǒng",meaning:"tổng, luôn luôn"},
{hanzi:"面积",pinyin:"miànjī",meaning:"diện tích"},
{hanzi:"平方米",pinyin:"píngfāngmǐ",meaning:"mét vuông"},
{hanzi:"沙发",pinyin:"shāfā",meaning:"ghế sofa"},
{hanzi:"站",pinyin:"zhàn",meaning:"bến, trạm"},
{hanzi:"班",pinyin:"bān",meaning:"chuyến"},
{hanzi:"对",pinyin:"duì",meaning:"đối với"},
{hanzi:"满意",pinyin:"mǎnyì",meaning:"hài lòng"},

{hanzi:"请假",pinyin:"qǐng jià",meaning:"xin nghỉ"},
{hanzi:"医院",pinyin:"yīyuàn",meaning:"bệnh viện"},
{hanzi:"得",pinyin:"dé",meaning:"phải, nên"},
{hanzi:"该",pinyin:"gāi",meaning:"nên"},
{hanzi:"妻子",pinyin:"qīzi",meaning:"vợ"},
{hanzi:"丈夫",pinyin:"zhàngfu",meaning:"chồng"},
{hanzi:"套",pinyin:"tào",meaning:"căn (lượng từ)"},
{hanzi:"房子",pinyin:"fángzi",meaning:"nhà"},
{hanzi:"以前",pinyin:"yǐqián",meaning:"trước đây"},
{hanzi:"已经",pinyin:"yǐjīng",meaning:"đã"},
{hanzi:"够",pinyin:"gòu",meaning:"đủ"},
{hanzi:"生活",pinyin:"shēnghuó",meaning:"cuộc sống"},
{hanzi:"决定",pinyin:"juédìng",meaning:"quyết định"},
{hanzi:"搬",pinyin:"bān",meaning:"chuyển, dời"},
{hanzi:"周围",pinyin:"zhōuwéi",meaning:"xung quanh"},
{hanzi:"环境",pinyin:"huánjìng",meaning:"môi trường"},
{hanzi:"安静",pinyin:"ānjìng",meaning:"yên tĩnh"},
{hanzi:"电梯",pinyin:"diàntī",meaning:"thang máy"},
];
let shuffled=[...vocabulary].sort(()=>Math.random()-0.5);
let index=0;
let answerShown=false;

function showWord(){
let w=shuffled[index];
document.getElementById("hanziBox").innerText=w.hanzi;
document.getElementById("infoBox").innerText="Nhấn \"Hiện đáp án\"";
answerShown=false;

let percent=Math.round(((index+1)/shuffled.length)*100);
document.getElementById("progressBar").style.width=percent+"%";
}

function showAnswer(){
if(answerShown) return;
let w=shuffled[index];
document.getElementById("infoBox").innerHTML="<b>"+w.pinyin+"</b><br>"+w.meaning;
answerShown=true;
speakWord();
}

function nextWord(){ if(index<shuffled.length-1){ index++; showWord(); } }
function prevWord(){ if(index>0){ index--; showWord(); } }

function speakWord(){
speechSynthesis.cancel();
let w=shuffled[index];
let u=new SpeechSynthesisUtterance(w.hanzi);
u.lang="zh-CN";
speechSynthesis.speak(u);
}

showWord();

</script>
</body>
</html>
